# merge-train – Einstellungen
# Ort: ~/.config/merge-train/config.toml  (oder Pfad in $MERGE_TRAIN_CONFIG)
# Alles optional; auskommentiert = Standardwert.

# Lokaler Projekt-Diff: bis gegen von in allen Repos aus „projekte“ als Zug.
# Auf einem Rechner nur für GitLab-MRs: false. Dann öffnet „merge-train“ ohne Argumente die MR-Liste.
# lokal = true
# projekte = "~/Projects"     # Ordner mit Repos, oder eine Liste aus Ordnern/einzelnen Repos
# von = "reviewed"
# bis = "claude"
# Arbeitsstand eines Agenten (auch nicht Committetes) gegen main, z. B. unter WSL:
#   projekte = ["~/workspaces/projekt", "~/workspaces/anderes"]
#   von = "origin/main"
#   bis = "arbeitsstand"        # Arbeitsverzeichnis statt Branch; „fertig“ gibt es dann nicht

# GitLab-Merge-Requests über glab (vorher einmal: glab auth login --hostname <host>)
# gitlab = true
# gitlab_host = ""            # leer: Host aus MR-URL bzw. git-Remote, sonst glab-Standardhost
# glab = "glab"               # Befehl, darf Argumente enthalten
# mr_liste = "reviewer"       # MR-Zug: reviewer | assignee | author | keine

# Läufe des Myrlings, die auf eine Prüfung warten: ein Waggon je Skript, Diff
# gegen die zuletzt angesehene Fassung. Fehlt der Befehl, ist die Quelle aus.
# myrling = true
# myrling_befehl = "~/Projects/newterminal/nas-setup/werkzeuge/nas-lauf"   # mit --anstehend --json

# Weitere Klone der GitLab-Projekte ohne Eintrag unter [repos]: ein MR aus gruppe/metrics-client findet
# <ordner>/metrics-client (oder <ordner>/gruppe/metrics-client), wenn dessen origin auf genau dieses Projekt zeigt
# klon_ordner = ["~/workspaces"]   # ein Ordner oder eine Liste

# Agent-Hinweise (jira-review): Dateien, die automatisch zum MR mit passendem „branch“ angezeigt werden
# hinweise = ["~/workspaces/projekt/tasks/*-review-markers.json"]

# Browser-Befehl. Leer: xdg-open, sonst wslview, sonst explorer.exe. Unter WSL z. B. "wslview".
# browser = ""

# port = 8771
# leerlauf = 3600            # Sekunden ohne Anfrage, dann beendet sich der Server (offene Seiten fragen alle 4 s)

# Log der Anfragen an die Quellen (lokales git, GitLab): ~/.cache/merge-train/aussen-<datum>.log, eine Datei je Tag.
# Wie viele Tage aufbewahren; 0 = kein Log.
# log_tage = 7

# agent vorfall: gibt es todo, wird der Bericht ein todo-Eintrag; sonst ein Issue in diesem GitHub-Repo
# (owner/repo, über gh api; Token mit Issues: Read/Write), unter dem Account, mit dem gh angemeldet ist.
# Leer = nur Datei in vorfaelle/; die Ausgabe nennt den Befehl, mit dem man sie nach Durchsicht einreicht.
# vorfall_github = ""
# gh = "gh"

# Erster Besuch eines MR: dessen Quell-Branch im lokalen Klon auschecken, wenn dort nichts Uncommittetes liegt
# mr_auschecken = true

# Listen links: dein Symbol für „zuletzt von dir“ (🤖 = Agent, Logo der Quelle = von außen)
# ich_symbol = "🤓"

# Lokaler Modus, „Feedback senden“, wenn keine Claude-Session zuhört: leer = todo-Eintrag (falls „todo“ da ist).
# Sonst ein Befehl mit {ordner}, {projekt}, {prompt}, z. B. "konsole --workdir {ordner} -e claude {prompt}"
# feedback_befehl = ""

# Eigene von/bis je lokalem Projekt (Name wie im Zug). Auf der Seite gewählte („▾“ am Waggon) gehen vor.
# Tabelle: muss nach allen einfachen Einträgen stehen, wie [agenten] und [repos] hier unten.
# [zweige.merge-train]
# von = "reviewed"
# bis = "claude"

# GitLab-Modus: Agenten, die man zu einem MR fragen kann („an <Name>“ im Kommentar-Editor, bleibt privat).
# Name = Befehl, den „Fragen senden“ startet, wenn keiner zuhört ({ordner} = Klon, {projekt}, {prompt}).
# Tabelle: muss nach allen einfachen Einträgen stehen.
# [agenten]
# Claude = "wt.exe -w 0 nt wsl.exe -e bash -lc 'cd {ordner} && claude \"$0\"' {prompt}"
# Copilot = "wt.exe -w 0 nt wsl.exe -e bash -lc 'cd {ordner} && copilot -i \"$0\"' {prompt}"

# Lokale Klone der GitLab-Projekte: Diff, Dateien und Commits kommen nur von dort.
# Muss am Ende stehen: alles nach [repos] gehört zu dieser Tabelle. Schlüssel = Projektpfad in GitLab.
# [repos]
# "gruppe/projekt" = "~/workspaces/projekt"
